<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <radialGradient id="goldGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#D4AF6A"/>
      <stop offset="60%" stop-color="#B8953F"/>
      <stop offset="100%" stop-color="#7A6030"/>
    </radialGradient>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1C1C22"/>
      <stop offset="100%" stop-color="#0C0C0E"/>
    </radialGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="200" cy="200" r="195" fill="url(#bgGrad)" stroke="#B8953F" stroke-width="2.5"/>

  <!-- Thin decorative ring -->
  <circle cx="200" cy="200" r="178" fill="none" stroke="#B8953F" stroke-width="0.75" stroke-opacity="0.4"/>

  <!-- Top decorative line ornament -->
  <line x1="120" y1="110" x2="280" y2="110" stroke="#B8953F" stroke-width="0.8" stroke-opacity="0.5"/>
  <circle cx="200" cy="110" r="3" fill="#B8953F" fill-opacity="0.7"/>
  <circle cx="120" cy="110" r="2" fill="#B8953F" fill-opacity="0.5"/>
  <circle cx="280" cy="110" r="2" fill="#B8953F" fill-opacity="0.5"/>

  <!-- Hotel building silhouette -->
  <!-- Main building body -->
  <rect x="148" y="195" width="104" height="80" fill="none" stroke="url(#goldGrad)" stroke-width="1.8"/>
  <!-- Roof triangle -->
  <polygon points="200,155 148,195 252,195" fill="none" stroke="url(#goldGrad)" stroke-width="1.8" stroke-linejoin="round"/>
  <!-- Chimney -->
  <rect x="185" y="140" width="10" height="18" fill="none" stroke="#B8953F" stroke-width="1.5"/>
  <!-- Door -->
  <rect x="189" y="240" width="22" height="35" fill="none" stroke="#D4AF6A" stroke-width="1.5"/>
  <!-- Windows row 1 -->
  <rect x="160" y="210" width="18" height="15" fill="none" stroke="#B8953F" stroke-width="1.2" stroke-opacity="0.8"/>
  <rect x="222" y="210" width="18" height="15" fill="none" stroke="#B8953F" stroke-width="1.2" stroke-opacity="0.8"/>
  <!-- Window cross dividers -->
  <line x1="169" y1="210" x2="169" y2="225" stroke="#B8953F" stroke-width="0.7" stroke-opacity="0.6"/>
  <line x1="160" y1="217" x2="178" y2="217" stroke="#B8953F" stroke-width="0.7" stroke-opacity="0.6"/>
  <line x1="231" y1="210" x2="231" y2="225" stroke="#B8953F" stroke-width="0.7" stroke-opacity="0.6"/>
  <line x1="222" y1="217" x2="240" y2="217" stroke="#B8953F" stroke-width="0.7" stroke-opacity="0.6"/>

  <!-- Star / crown above roof -->
  <polygon points="200,133 203,143 213,143 205,149 208,159 200,153 192,159 195,149 187,143 197,143"
    fill="#B8953F" fill-opacity="0.9"/>

  <!-- "LE SIX" text -->
  <text x="200" y="308"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="32"
    font-weight="400"
    fill="url(#goldGrad)"
    text-anchor="middle"
    letter-spacing="10">LE SIX</text>

  <!-- "HOTEL" subtext -->
  <text x="200" y="332"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="13"
    font-weight="400"
    fill="#B8953F"
    fill-opacity="0.7"
    text-anchor="middle"
    letter-spacing="8">HOTEL</text>

  <!-- Bottom ornament -->
  <line x1="140" y1="348" x2="260" y2="348" stroke="#B8953F" stroke-width="0.8" stroke-opacity="0.4"/>
  <line x1="155" y1="354" x2="245" y2="354" stroke="#B8953F" stroke-width="0.5" stroke-opacity="0.25"/>
</svg>
